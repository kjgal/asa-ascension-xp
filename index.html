<style>

:root{color-scheme:dark;--bg:#0b141a;--card:#092039;--line:#568aa055;--accent:#9acbdc;--text:#e2eff5;--muted:#acc2ce;--error:#efb6a6;font-family:'Chakra Petch',system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100svh;color:var(--text);background:var(--bg);font-size:15px;line-height:1.5;isolation:isolate}body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(#07121a28,#07121a60),url('assets/ascension-night.webp') center/cover no-repeat}
main{width:min(calc(100% - 48px),680px);margin:auto;padding:clamp(36px,7vh,74px) 0 40px;overflow-wrap:anywhere}.hero{margin-bottom:32px;text-shadow:2px 2px #02090d}.eyebrow{color:#b6c8c8;text-transform:uppercase;font-size:11px;letter-spacing:1.6px;font-weight:700}h1{font-size:clamp(34px,6vw,49px);font-weight:700;line-height:1.1;letter-spacing:1px;text-transform:uppercase;margin:12px 0 20px}.title-sub{display:block;font-size:.45em;color:var(--accent);letter-spacing:2px;margin-top:10px}p{margin:0}
/* A quiet holographic surface tinted from the surrounding landscape. */
.panel{position:relative;min-width:0;max-width:100%;margin:0 4px;padding:26px;background:linear-gradient(145deg,#0c294c99,#071b2cbb);border:1px solid #82bbd04d;border-radius:2px;overflow:visible;box-shadow:inset 0 0 28px #5bb3db06,0 0 22px #79c9ed08,0 16px 45px #020a1433}
.inputs{display:grid;grid-template-columns:minmax(0,1fr) 20px minmax(0,1fr);gap:18px;align-items:center;min-width:0;max-width:100%;overflow:visible}.field{min-width:0;max-width:100%}label{display:block;color:#c3d8e4;font-size:12px;font-weight:700;margin-bottom:10px}input,button{font-family:'Chakra Petch',system-ui,sans-serif;min-width:0;max-width:100%;cursor:pointer;color:#cce7f3;background:#26506b26;border:1px solid #93c7dc66;border-radius:1px;padding:10px 16px;min-height:44px;font-size:12px;font-weight:600;box-shadow:inset 0 0 12px #80cdeb08;transition:background .15s,border-color .15s}input{display:block;width:100%;min-height:66px;padding:12px 14px;color:var(--text);background:#05162870;border:1px solid #75a7bf61;border-radius:1px;box-shadow:inset 0 0 18px #020d1922;font-weight:700;font-size:32px;font-variant-numeric:tabular-nums;line-height:1.2}input:hover{border-color:#a1d1e3a3;background:#0d2c4766}input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}input[aria-invalid=true]{border-color:var(--error)}.arrow{font-size:23px;color:#8fb3c9;text-align:center}
.result{margin-top:25px;padding:22px 0 0;background:transparent;border:0;border-top:1px solid #82bbd030;border-radius:0;box-shadow:none;min-width:0;max-width:100%;overflow:hidden}.result-top{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;align-items:center;min-width:0;max-width:100%;overflow:hidden}.caption{font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:#a4c8db}.pill{font-size:11px;color:#a8c5d5;line-height:1.5}.amount{display:block;font-size:clamp(25px,5.4vw,42px);line-height:1.3;font-weight:700;letter-spacing:-1px;color:#d8f1fc;text-shadow:0 0 18px #8ccde02b;margin:14px 0 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0;max-width:100%;margin:22px 0 0;padding-bottom:0;overflow:visible}button{font-family:'Chakra Petch',system-ui,sans-serif;cursor:pointer;color:#d0e9df;background:#263f3b;border:2px solid #799f96;border-radius:0;padding:10px 16px;min-height:44px;font-size:12px;font-weight:700;box-shadow:3px 3px #0c1013;transition:none}button:hover{background:#33628350;border-color:#b0e5f1b3}button:active{transform:translateY(1px);background:#41789755;box-shadow:none}button:disabled{opacity:.55;cursor:default;transform:none}.copy-status{font-size:11px;color:var(--muted)}.error{color:var(--error);font-size:12px;margin-top:16px}.error[hidden]{display:none}
/* Compact game-menu disclosure below the title, matching the primary button. */
details{min-width:0;max-width:100%;font-size:12px;text-shadow:none}summary{display:inline-block;cursor:pointer;list-style:none;font-weight:600;color:#bbd3e2;background:#0a203666;border:1px solid #75a7bf4d;border-radius:1px;box-shadow:none;min-height:40px;padding:9px 13px;font-size:11px;line-height:1.5}summary::-webkit-details-marker{display:none}summary:before{content:"+";display:inline-block;margin-right:9px;color:var(--accent)}details[open] summary:before{content:"−"}summary:hover{border-color:#99ccde99;background:#23496555}details[open]{margin:0 4px;padding:14px 16px 16px;background:#081e32c9;border:1px solid #75a7bf4d;box-shadow:0 8px 26px #020a1426}details[open] summary{margin:-4px 0 4px -6px;background:#23496555;border-color:#75a7bf66;color:#cde8f2}details p{color:var(--muted);font-size:11px;margin-top:15px;line-height:1.6}.data-note{font-size:10px;color:#a0afb3;margin-top:8px}.breakdown{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:16px 0 0;min-width:0;max-width:100%;overflow:hidden}.breakdown dt{color:var(--muted);font-size:11px}.breakdown dd{margin:6px 0 0;color:#d0e5f0;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}noscript{display:block;padding:18px;color:var(--error)}
@media(max-width:520px){main{width:calc(100% - 40px);padding-top:34px}.hero{margin-bottom:28px}.eyebrow{font-size:10px}h1{font-size:35px}.title-sub{font-size:17px;letter-spacing:1.4px}.panel{padding:22px 19px}.inputs{gap:10px;grid-template-columns:minmax(0,1fr) 16px minmax(0,1fr)}label{font-size:11px}input{font-size:28px;padding:12px 10px;min-height:62px}.arrow{font-size:19px}.result{padding:20px 0 0;margin-top:22px}.amount{font-size:clamp(22px,6.9vw,34px);letter-spacing:-1px;margin-top:13px}.caption,.pill{font-size:10px}.breakdown{gap:10px}.breakdown dd{font-size:12px}body:before{background-position:100% center}}


.panel:before{content:"";position:absolute;inset:-1px;pointer-events:none;background:linear-gradient(#a5dbed,#a5dbed) left top/14px 1px no-repeat,linear-gradient(#a5dbed,#a5dbed) left top/1px 14px no-repeat,linear-gradient(#a5dbed,#a5dbed) right top/14px 1px no-repeat,linear-gradient(#a5dbed,#a5dbed) right top/1px 14px no-repeat,linear-gradient(#a5dbed,#a5dbed) left bottom/14px 1px no-repeat,linear-gradient(#a5dbed,#a5dbed) left bottom/1px 14px no-repeat,linear-gradient(#a5dbed,#a5dbed) right bottom/14px 1px no-repeat,linear-gradient(#a5dbed,#a5dbed) right bottom/1px 14px no-repeat;opacity:.7}
@media(prefers-reduced-motion:reduce){button{transition:none}}

.xp-visual{margin-top:23px;min-width:0;max-width:100%;--earned:0%;overflow:hidden;padding:2px 0 1px}.xp-visual[hidden]{display:none}.xp-meter-caption,.xp-meter-levels{display:flex;justify-content:space-between;gap:12px;min-width:0;max-width:100%;overflow:hidden;font-size:11px;color:#a8c8da}.xp-meter-caption{margin-bottom:11px}.xp-meter-caption strong{font-weight:600;color:#d0ecf7}.xp-track{height:12px;border:1px solid #8fc3d14d;background:#03132180;position:relative;min-width:0;max-width:100%;overflow:hidden;border-radius:1px}.xp-fill{position:absolute;inset:0 auto 0 0;width:var(--earned);background:linear-gradient(90deg,#386b8a99,#91cedddd);box-shadow:0 0 12px #99d9eb40;transition:width .8s cubic-bezier(.2,.7,.2,1)}.xp-marker{position:absolute;left:clamp(0px,var(--earned),calc(100% - 2px));top:0;bottom:0;width:2px;background:#d8f7ff;box-shadow:0 0 7px #b2e5ef;transition:left .8s cubic-bezier(.2,.7,.2,1)}.xp-track:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),#16344799 calc(10% - 1px) 10%)}.xp-sweep{position:absolute;inset:0 auto 0 -30%;width:24%;background:linear-gradient(90deg,transparent,#c9f4ff66,transparent);opacity:0;pointer-events:none}.xp-visual.updating .xp-sweep{animation:xp-sweep 1.05s ease-out 1}.xp-meter-levels{margin-top:8px;font-size:10px;color:#9bb8ca}@keyframes xp-sweep{0%{transform:translateX(0);opacity:0}20%{opacity:.75}100%{transform:translateX(550%);opacity:0}}
@media(prefers-reduced-motion:reduce){.xp-fill,.xp-marker{transition:none}.xp-visual.updating .xp-sweep{animation:none}}


.intro{max-width:440px;font-size:14px;line-height:1.55;color:#b7cfdd;text-shadow:0 1px 8px #020b12;margin-top:0}input::placeholder{color:#90aebe;opacity:.65;font-size:.65em;font-weight:400}button:disabled{opacity:.45;cursor:default}button:disabled:active{transform:none}

.xp-breakdown{border-top:1px solid #82bbd030;padding-top:17px;margin-top:21px}.xp-breakdown[hidden]{display:none}

/* Quiet tagline and gentle contrast rather than another header box. */
.hero{position:relative;isolation:isolate;margin-bottom:38px}.hero:before{content:"";position:absolute;inset:-16px -20px -12px;z-index:-1;pointer-events:none;background:linear-gradient(90deg,#06162755,transparent 85%);filter:blur(12px)}
.hero .intro{font-family:'Chakra Petch',system-ui,sans-serif;font-size:13px;font-weight:400;line-height:1.7;max-width:26ch;color:#a9c2d2;margin-top:6px;text-shadow:0 1px 8px #030c18}
@media(max-width:520px){body:before{background-position:95% center}.hero{margin-bottom:32px}.hero .intro{font-size:12px;max-width:25ch}}


/* Atmosphere stays behind the interface and never moves the landscape itself. */
.scene-mist{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;contain:paint}.scene-mist span{position:absolute;inset:-14%;min-width:0;background:radial-gradient(ellipse at 28% 68%,#a7d5e31c 0,transparent 45%),radial-gradient(ellipse at 73% 81%,#93c7db14 0,transparent 43%);opacity:.65;animation:mist-drift 46s ease-in-out infinite alternate}.scene-mist span+span{background:radial-gradient(ellipse at 72% 59%,#abcddd16 0,transparent 40%);opacity:.5;animation:mist-drift-back 63s ease-in-out infinite alternate}
@keyframes mist-drift{from{transform:translate3d(-6%,2%,0)}to{transform:translate3d(7%,-1%,0)}}@keyframes mist-drift-back{from{transform:translate3d(7%,-1%,0)}to{transform:translate3d(-7%,2%,0)}}
.xp-marker{animation:marker-beacon 3.8s ease-in-out infinite}@keyframes marker-beacon{0%,100%{opacity:.65;box-shadow:0 0 4px #9ed1e180}50%{opacity:1;box-shadow:0 0 11px #b2e5efb3}}
.reset-row{display:flex;justify-content:flex-end;flex-wrap:wrap;min-width:0;max-width:100%;overflow:visible;margin-top:22px}.reset-row button{font-family:'Chakra Petch',system-ui,sans-serif;font-size:12px;font-weight:500;min-width:0;max-width:100%;min-height:44px;padding:9px 15px;background:#12344d26;border:1px solid #88b7cb55;border-radius:1px;box-shadow:none;color:#adcddd;cursor:pointer}.reset-row button:hover:not(:disabled){background:#244e6b50;border-color:#a3d3e08c}.reset-row button:disabled{opacity:.35;cursor:default}
@media(prefers-reduced-motion:reduce){.scene-mist span,.xp-marker{animation:none;transform:none}.scene-mist span{opacity:.35}.xp-marker{opacity:1}}


.calculate-button{display:block;width:100%;min-width:0;max-width:100%;margin-top:21px;padding:12px 16px;min-height:46px;font-family:'Chakra Petch',system-ui,sans-serif;font-size:14px;font-weight:600;background:#24527355;color:#d8f0fa;border:1px solid #a3d4e399;border-radius:1px;box-shadow:inset 0 0 16px #9fdae20a}.calculate-button:hover:not(:disabled){background:#346b8b66;border-color:#c1eaf2}.calculate-button:disabled{opacity:.55;cursor:wait}.result[hidden]{display:none}
/* Broader, more visible banks of mist move across the lake behind the controls. */
.scene-mist span{inset:-24%;background:radial-gradient(ellipse at 22% 65%,#acd8e33d 0,#8ac1d51c 24%,transparent 51%),radial-gradient(ellipse at 78% 82%,#a6ced52e 0,transparent 42%);opacity:.8;animation-duration:23s}.scene-mist span+span{background:radial-gradient(ellipse at 76% 49%,#b4d3df2e 0,#9fc8db12 23%,transparent 45%);opacity:.65;animation-duration:32s}
@keyframes mist-drift{from{transform:translate3d(-13%,3%,0)}to{transform:translate3d(13%,-2%,0)}}@keyframes mist-drift-back{from{transform:translate3d(13%,-2%,0)}to{transform:translate3d(-13%,3%,0)}}
@media(prefers-reduced-motion:reduce){.scene-mist span{animation:none;transform:none;opacity:.35}}


/* Shaped fog banks reveal their travel against the trees and water. */
.scene-mist span{inset:auto;left:-40%;top:51%;width:180%;height:34%;min-width:0;background:url('assets/lake-mist-a.svg') center/100% 100% no-repeat;opacity:.60;animation:lake-mist-travel 24s linear -7s infinite alternate;will-change:transform}
.scene-mist span+span{inset:auto;left:-40%;top:71%;width:180%;height:25%;background:url('assets/lake-mist-b.svg') center/100% 100% no-repeat;opacity:.52;animation:lake-mist-return 30s linear -12s infinite alternate}
@keyframes lake-mist-travel{from{transform:translate3d(-10%,0,0)}to{transform:translate3d(10%,-3%,0)}}
@keyframes lake-mist-return{from{transform:translate3d(10%,0,0)}to{transform:translate3d(-10%,3%,0)}}
@media(prefers-reduced-motion:reduce){.scene-mist span,.scene-mist span+span{animation:none;transform:none;will-change:auto}}


.sky-flight{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;contain:paint}.sky-flight > #flight-scene{position:absolute;display:block;max-width:none;min-width:0;overflow:hidden}.sky-flight image{image-rendering:auto}
@media(prefers-reduced-motion:reduce){#distant-wyvern{display:none}}

.obelisk-beam{opacity:.4;transform-box:view-box;transform-origin:1415px 235px;animation:obelisk-breathe 4.8s ease-in-out infinite;pointer-events:none}@keyframes obelisk-breathe{0%,100%{opacity:.16}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.obelisk-beam{animation:none;opacity:.3}}

/* Compact installation control: anchored to the viewport corner, outside the form. */
.app-tools{position:relative;z-index:5;display:flex;justify-content:flex-start;min-width:0;max-width:100%;margin:0 0 18px;overflow:visible}
.install-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:0;max-width:100%;min-height:44px;padding:8px 11px;font-family:inherit;font-size:11px;font-weight:500;letter-spacing:.3px;color:#afcedd;background:#0a243b70;border:1px solid #88b7cb50;border-radius:1px;box-shadow:none;overflow:hidden}
.install-button svg{width:14px;height:14px;flex:0 0 14px;overflow:hidden;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:square;stroke-linejoin:miter}
.install-button:hover{background:#244e6b60;border-color:#a3d3e099}
.install-help{position:absolute;left:0;top:calc(100% + 8px);width:min(280px,calc(100vw - 32px));max-width:calc(100vw - 32px);min-width:0;padding:15px;background:#071b2cf5;border:1px solid #82bbd066;box-shadow:0 8px 24px #020a1455;overflow:hidden;font-size:12px;line-height:1.6;color:#bbd5e2;overflow-wrap:anywhere}
.install-help p{margin:0 0 10px}.install-help button{display:block;margin-left:auto;min-height:40px;padding:7px 12px;font-family:inherit;font-size:11px;background:#163b5155;border:1px solid #88b7cb55;box-shadow:none;color:#bbd5e2}
.app-tools[hidden],.install-help[hidden]{display:none}
</style>
</head>

<header class="hero"><div class="eyebrow">ARK: Survival Ascended</div><h1>Ascension<span class="title-sub">XP Calculator</span></h1><p class="intro">Just one more level… and a few billion XP.</p></header>
<section class="panel" aria-label="XP calculator">
<form id="level-form" novalidate>
<div class="inputs">
<div class="field"><label for="current">Current Level</label><input id="current" enterkeyhint="next" type="number" inputmode="numeric" min="1" max="245" step="1" placeholder="1–245" required aria-describedby="error"></div>
<div class="arrow" aria-hidden="true">→</div>
<div class="field"><label for="target">Target Level</label><input id="target" enterkeyhint="done" type="number" inputmode="numeric" min="1" max="245" step="1" placeholder="1–245" required aria-describedby="error"></div>
</div>
<button class="calculate-button" id="calculate" type="submit">Calculate</button>
<p id="error" class="error" hidden></p>
</form>
<div class="result" id="result" hidden tabindex="-1" aria-live="polite" aria-atomic="true">
<div class="result-top"><span class="caption">XP required</span><span class="pill" id="gap"></span></div>
<output class="amount" id="amount" for="current target">—</output>
<div class="xp-visual" id="xp-visual" hidden>
<div class="xp-meter-caption"><span id="xp-meter-title">XP progress</span><strong id="xp-percent">—</strong></div>
<div class="xp-track" id="xp-meter" role="progressbar" aria-labelledby="xp-meter-title" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="xp-fill" aria-hidden="true"></span><span class="xp-marker" aria-hidden="true"></span><span class="xp-sweep" aria-hidden="true"></span></div>
<div class="xp-meter-levels" aria-hidden="true"><span id="xp-current-level">Current</span><span id="xp-target-level">Target</span></div>
